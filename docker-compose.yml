services:
  dns-proxy:
    image: adguard/dnsproxy@sha256:7b0aad81037197eed34be80f26151c20b8755bb459438b9f7cc6eefad9db4e2d
    restart: unless-stopped
    command:
      - --listen=0.0.0.0
      - --port=53
      - --upstream=https://1.1.1.1/dns-query
      - --upstream=https://1.0.0.1/dns-query
      - --upstream-mode=parallel
      - --cache
      - --cache-optimistic
      - --cache-size=4194304
      - --cache-min-ttl=60
      - --cache-max-ttl=600
      - --timeout=5s
      - --refuse-any
    healthcheck:
      test: ["CMD", "nslookup", "one.one.one.one", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      monitoring-dns:
        ipv4_address: ${MONITORING_DNS_ADDRESS:-10.253.53.53}
      monitoring-outbound:

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env or Dokploy}
    volumes:
      - zabbix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monitoring-internal

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4.14
    restart: unless-stopped
    # Docker conserve la résolution des services internes et transmet les noms
    # publics au proxy DNS local, qui utilise HTTPS plutôt que l'UDP externe.
    dns:
      - ${MONITORING_DNS_ADDRESS:-10.253.53.53}
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env or Dokploy}
      ZBX_TIMEOUT: "10"
      # Les macros temporelles des notifications ({EVENT.TIME}, etc.) sont
      # développées par le serveur, indépendamment du fuseau PHP du frontend.
      TZ: Europe/Paris
    depends_on:
      dns-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    networks:
      - monitoring-internal
      - monitoring-dns
      # Le serveur Zabbix doit sortir vers les URLs supervisées, tout en restant
      # isolé des autres services internes de la plateforme.
      - monitoring-outbound

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.14
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env or Dokploy}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Metio Monitoring
      PHP_TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    expose:
      - "8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${DOKPLOY_NETWORK:-dokploy-network}
      traefik.http.routers.metio-monitoring.rule: Host(`${MONITORING_DOMAIN:?set in .env or Dokploy}`)
      traefik.http.routers.metio-monitoring.entrypoints: websecure
      traefik.http.routers.metio-monitoring.tls: "true"
      traefik.http.services.metio-monitoring.loadbalancer.server.port: "8080"
    networks:
      - monitoring-internal
      - dokploy-network

  bootstrap:
    build:
      context: ./bootstrap
    restart: "no"
    environment:
      ZABBIX_API_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_ADMIN_PASSWORD: ${ZABBIX_ADMIN_PASSWORD:?set in .env or Dokploy}
    volumes:
      - bootstrap-state:/state
      - ./bootstrap/projects.json:/bootstrap/projects.json:ro
    depends_on:
      zabbix-web:
        condition: service_started
    networks:
      - monitoring-internal

volumes:
  zabbix-postgres-data:
  bootstrap-state:

networks:
  monitoring-internal:
    internal: true
  monitoring-dns:
    internal: true
    ipam:
      config:
        - subnet: ${MONITORING_DNS_SUBNET:-10.253.53.0/24}
  monitoring-outbound:
  dokploy-network:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
